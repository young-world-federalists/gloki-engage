name: Deploy to GitHub Pages

# One Pages site, two apps (Ouri + Eston, 2026-10-28; swapped 2026-10-29):
#   server-side, full app (real servers) -> https://young-world-federalists.github.io/gloki-engage/
#   ui, beta trim (mock data)            -> https://young-world-federalists.github.io/gloki-engage/demo/
# A push to either branch rebuilds both, so neither overwrites the other.
# GitHub runs the copy of this file in the pushed branch: keep it identical
# on server-side and ui.

on:
  push:
    branches: [server-side, ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Gives the build the github-pages environment's variables (Settings ->
    # Environments -> github-pages), which override .env below.
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
        with:
          ref: server-side
          path: server-side
      - uses: actions/checkout@v6
        with:
          ref: ui
          path: ui
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server-side/package-lock.json
            ui/package-lock.json

      - name: Build server-side (site root)
        working-directory: server-side
        # Environment variables override the repo's .env at build time (Vite
        # bakes them into the bundle). Exported only when set, so an unset
        # variable leaves the .env value in place instead of blanking it.
        env:
          APPLICATION_SERVER_URL: ${{ vars.VITE_APPLICATION_SERVER_URL }}
          APPLICATION_AGENT: ${{ vars.VITE_APPLICATION_AGENT }}
        run: |
          if [ -n "$APPLICATION_SERVER_URL" ]; then export VITE_APPLICATION_SERVER_URL="$APPLICATION_SERVER_URL"; fi
          if [ -n "$APPLICATION_AGENT" ]; then export VITE_APPLICATION_AGENT="$APPLICATION_AGENT"; fi
          npm ci
          npm run build:prod

      - name: Build ui beta (/demo/)
        working-directory: ui
        run: |
          npm ci
          npm run build:beta -- --base /gloki-engage/demo/

      - name: Assemble site
        run: |
          cp -R server-side/dist site
          cp -R ui/dist site/demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
