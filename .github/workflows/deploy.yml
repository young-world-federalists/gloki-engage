name: Deploy to GitHub Pages

# One Pages site, one app (Ouri, 2026-10-29), deployed by hand: Actions -> Deploy
# to GitHub Pages -> Run workflow, choosing the branch. Built as the beta trim, at
# https://young-world-federalists.github.io/gloki-engage/
# The full app is the same build: set localStorage 'gloki.fullApp' to 'true'
# in a browser (src/appMode.ts). Any page also has ?demo=true (docs/DEMO_MODE.md).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Gives the build the github-pages environment's variables (Settings ->
    # Environments -> github-pages), which override .env below.
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build beta (site root)
        # Environment variables override the repo's .env at build time (Vite
        # bakes them into the bundle). Exported only when set, so an unset
        # variable leaves the .env value in place instead of blanking it.
        env:
          APPLICATION_SERVER_URL: ${{ vars.VITE_APPLICATION_SERVER_URL }}
          APPLICATION_AGENT: ${{ vars.VITE_APPLICATION_AGENT }}
        run: |
          if [ -n "$APPLICATION_SERVER_URL" ]; then export VITE_APPLICATION_SERVER_URL="$APPLICATION_SERVER_URL"; fi
          if [ -n "$APPLICATION_AGENT" ]; then export VITE_APPLICATION_AGENT="$APPLICATION_AGENT"; fi
          npm ci
          npm run build:beta

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
